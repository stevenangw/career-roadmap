  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="color: #ef4444; background: #0f172a; padding: 2rem; border-radius: 0.5rem; margin: 2rem; font-family: monospace; border: 1px solid #1e293b; max-width: 800px; margin-inline: auto;">' +
            '<h3 style="margin-top: 0; color: #f87171;">⚠️ Runtime Crash Detected</h3>' +
            '<p style="font-weight: bold; color: #e2e8f0;">' + message + '</p>' +
            '<pre style="white-space: pre-wrap; font-size: 0.875rem; color: #94a3b8; line-height: 1.5; margin-top: 1rem; border-top: 1px solid #1e293b; padding-top: 1rem;">' +
            'Source: ' + source + '\nLine: ' + lineno + ' | Col: ' + colno + '\n\n' + 
            (error && error.stack ? error.stack : 'No stack trace available') + 
            '</pre>' +
            '</div>';
        }
        return false;
      };
    </script>
